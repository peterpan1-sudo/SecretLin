name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
    inputs:
      version:
        description: "Version déjà publiée dont réécrire le texte d'installation (ex. 1.1.2). Vide : CI seule."
        required: false
        default: ""
  # Publier une version sur GitHub construit le paquet et joint les .deb à la version.
  release:
    types: [published]

jobs:
  tests:
    name: Tests (pytest)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      # Tk est nécessaire : tests/test_marques.py importe customtkinter.
      - name: Installer Python et Tk
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq python3-tk python3-venv

      - name: Installer les dépendances
        run: |
          python3 -m venv .venv
          .venv/bin/pip install -q -r requirements.txt pytest

      - name: Lancer pytest
        run: .venv/bin/python -m pytest -q

  deb:
    name: Paquet .deb
    runs-on: ubuntu-24.04
    # Kali (la cible du paquet) fournit python3-cryptography >= 44, requis pour Argon2id.
    container: kalilinux/kali-rolling
    steps:
      - uses: actions/checkout@v4

      - name: Installer les outils de construction
        run: |
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends \
            build-essential debhelper dh-python python3 python3-pip \
            python3-cryptography python3-pil python3-pil.imagetk python3-pytest python3-tk
          # customtkinter n'est pas dans les dépôts : installé avec pip pour les tests du paquet.
          pip3 install -q --break-system-packages customtkinter

      - name: Vérifier que le tag correspond à debian/changelog
        if: github.event_name == 'release'
        run: |
          attendu="v$(dpkg-parsechangelog -S Version)"
          if [ "$GITHUB_REF_NAME" != "$attendu" ]; then
            echo "Le tag $GITHUB_REF_NAME ne correspond pas à debian/changelog ($attendu)."
            exit 1
          fi

      - name: Construire le paquet
        # -d : python3-customtkinter n'existe pas en paquet, il est fourni par pip ci-dessus.
        run: dpkg-buildpackage -us -uc -b -d

      - name: Vérifier le paquet
        run: |
          dpkg-deb -I ../secretlin_*_all.deb
          dpkg-deb -c ../secretlin_*_all.deb
          mkdir -p dist && cp ../secretlin_*_all.deb dist/

      - uses: actions/upload-artifact@v4
        with:
          name: secretlin-deb
          path: dist/*.deb

  publier:
    name: Joindre les .deb à la version
    if: github.event_name == 'release'
    needs: [tests, deb]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: secretlin-deb
          path: dist

      # customtkinter et darkdetect ne changent pas : on reprend les paquets de la version 1.0.1.
      - name: Récupérer les bibliothèques
        run: gh release download v1.0.1 --pattern 'python3-*_all.deb' --dir dist

      - name: Joindre les fichiers à la version
        run: gh release upload "$GITHUB_REF_NAME" dist/*.deb --clobber

  installation:
    name: Texte d'installation de la version
    # À chaque publication, ou à la demande pour une version déjà publiée.
    if: github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && inputs.version != '')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ github.event_name == 'release' && github.ref_name || format('v{0}', inputs.version) }}
    steps:
      - uses: actions/checkout@v4

      - name: Réécrire la section Installation
        run: |
          gh release view "$TAG" --json body --jq .body > notes.md
          python3 outils/texte_installation.py "$TAG" notes.md
          gh release edit "$TAG" --notes-file notes.md
